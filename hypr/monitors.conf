# Spare screen config - for Hyprland without Lua. The active path takes the settings
# from lua/monitors.lua (and that one from lua/monitors_data.lua, which is the Display panel
# collects from settings.json). There is only a general default here: any connected
# monitor in preferred mode, scale 1.0.
#
# Set your resolution/frequency/scale in the settings (Super+I → Display) —
# they will survive the renewal. Edits right here will also be saved: the file is in KEEP.
monitor=,preferred,auto,1.0
