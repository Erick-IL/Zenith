<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <g fill="#ffffff" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Base e Muralha Principal -->
    <rect x="20" y="44" width="60" height="38" rx="2" stroke-width="2"/>
    <!-- Porta em Arco (Gótica) -->
    <path d="M 43 82 L 43 62 C 43 55 57 55 57 62 L 57 82 Z" fill="#000000" stroke-width="1.5"/>

    <!-- Torre Central (Mais Alta) -->
    <rect x="40" y="24" width="20" height="22" stroke-width="1.5"/>
    <!-- Ameias Torre Central -->
    <rect x="39" y="18" width="5" height="7" stroke-width="1"/>
    <rect x="47.5" y="18" width="5" height="7" stroke-width="1"/>
    <rect x="56" y="18" width="5" height="7" stroke-width="1"/>
    <line x1="39" y1="24" x2="61" y2="24" stroke-width="2"/>

    <!-- Torre Esquerda -->
    <rect x="18" y="34" width="16" height="18" stroke-width="1.5"/>
    <!-- Ameias Torre Esquerda -->
    <rect x="17" y="28" width="4" height="7" stroke-width="1"/>
    <rect x="24" y="28" width="4" height="7" stroke-width="1"/>
    <rect x="31" y="28" width="4" height="7" stroke-width="1"/>

    <!-- Torre Direita -->
    <rect x="66" y="34" width="16" height="18" stroke-width="1.5"/>
    <!-- Ameias Torre Direita -->
    <rect x="65" y="28" width="4" height="7" stroke-width="1"/>
    <rect x="72" y="28" width="4" height="7" stroke-width="1"/>
    <rect x="79" y="28" width="4" height="7" stroke-width="1"/>

    <!-- Ameias Muralha Cortina -->
    <rect x="34" y="40" width="4" height="5" stroke-width="1"/>
    <rect x="62" y="40" width="4" height="5" stroke-width="1"/>
  </g>
</svg>