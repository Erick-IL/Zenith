<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <g fill="#ffffff" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Adaga Tática Transpassada (Vertical) -->
    <!-- Cabo / Pomo -->
    <circle cx="50" cy="8" r="3.5" stroke-width="1.5"/>
    <rect x="47" y="11" width="6" height="15" rx="1.5" stroke-width="1.5"/>
    <line x1="38" y1="26" x2="62" y2="26" stroke-width="3"/>
    <!-- Lâmina saindo embaixo do queixo -->
    <path d="M 46 80 L 50 94 L 54 80 Z" stroke-width="1"/>
    <line x1="50" y1="26" x2="50" y2="92" stroke-width="1"/>

    <!-- Caveira -->
    <path d="M 30 50 C 30 34 40 28 50 28 C 60 28 70 34 70 50 C 70 60 66 65 64 69 L 60 78 L 40 78 L 36 69 C 34 65 30 60 30 50 Z" stroke-width="2.5" fill="none"/>
    <!-- Órbitas Oculares -->
