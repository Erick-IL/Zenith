##############################################################################
# A spare config is for Hyprland, which cannot read hyprland.lua.
#
# The real Zenith config is in hyprland.lua and lua/ modules. Hyprland,
# who knows Lua, selects it himself and does not read this file at all - it exists
# just so that on older versions the system does not rise naked:
# no combinations, no pill and no way to open the terminal.
#
# Therefore, there is deliberately no parity with lua/: repeat two hundred lines in two
# places means in a month you will have two different configs, one of which is lying.
# Here are the only things you can’t work without: the shell, windows, tables, sound.
# Everything else is in lua/, and the correct answer to “something is missing” is
# update Hyprland, and not add here.
##############################################################################

$mainMod = SUPER
$terminal = footclient
$shell = qs -c $HOME/.config/zenith
$pill = qs -c $HOME/.config/zenith ipc call pill

exec-once = $shell
exec-once = hyprpaper
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = udiskie --no-notify --no-tray
exec-once = hyprsunset -t 5000

# ------------------------------------------------------------------ pill
bind = $mainMod, A, exec, $pill launcher
bind = $mainMod, Tab, exec, $pill overview
bind = $mainMod, Z, exec, $pill controls
bind = $mainMod, I, exec, $pill settings
bind = $mainMod, slash, exec, $pill shortcuts
bind = $mainMod SHIFT, W, exec, $pill wifi
bind = $mainMod SHIFT, B, exec, $pill bluetooth
bind = $mainMod, V, exec, $pill clipboard
bind = CTRL ALT, Delete, exec, $pill powermenu
bind = $mainMod SHIFT, N, exec, $pill notifications
bind = $mainMod, P, exec, $pill record
bind = $mainMod SHIFT, P, exec, $pill passwords
bind = $mainMod, E, exec, $pill files
bind = $mainMod SHIFT, T, exec, $pill theme
bind = , code:108, exec, $HOME/.config/zenith/scripts/voxtype.sh start
bindr = , code:108, exec, $HOME/.config/zenith/scripts/voxtype.sh stop


# ------------------------------------------------------------- applications
bind = $mainMod, T, exec, $terminal
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, F, exec, firefox

# ------------------------------------------------------------------- windows
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, F, fullscreen
bind = $mainMod, W, togglefloating
bind = $mainMod, L, exec, $HOME/.config/zenith/scripts/lock.sh
bind = $mainMod SHIFT, M, exit
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ---------------------------------------------------------- desktops
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# ------------------------------------------------------- volume, brightness
# Through the same scripts as the main config: the step increases while holding,
# and the level is shown by the pill itself.
bindel = , XF86AudioRaiseVolume, exec, $HOME/.local/bin/smart_volume.sh up
bindel = , XF86AudioLowerVolume, exec, $HOME/.local/bin/smart_volume.sh down
bindl  = , XF86AudioMute,        exec, $HOME/.local/bin/smart_volume.sh mute
bindel = , XF86MonBrightnessUp,   exec, $HOME/.local/bin/smart_brightness.sh up
bindel = , XF86MonBrightnessDown, exec, $HOME/.local/bin/smart_brightness.sh down
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# laptop lid - lock
bindl = , switch:on:Lid Switch,  exec, $HOME/.config/zenith/scripts/lock.sh

# ------------------------------------------------------------------- view
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1
    layout = dwindle
}

decoration {
    rounding = 12
    blur {
        enabled = true
        size = 6
        passes = 2
    }
}

input {
    kb_layout = br,us
    kb_variant = abnt2,
    kb_model = abnt2
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

# Generated from Zenith settings; personal overrides below still take precedence.
source = ~/.config/hypr/input_data.conf

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# ==============================================================================
# Пользовательские конфигурации (Custom User Configs)
# Любые файлы в ~/.config/hypr/custom/ переопределяют настройки по умолчанию
# и сохраняются при обновлениях системы.
# ==============================================================================
source = ~/.config/hypr/custom/env.conf
source = ~/.config/hypr/custom/execs.conf
source = ~/.config/hypr/custom/general.conf
source = ~/.config/hypr/custom/rules.conf
source = ~/.config/hypr/custom/keybinds.conf
source = ~/.config/hypr/custom/user.conf
source = ~/.config/hypr/custom/custom.conf
