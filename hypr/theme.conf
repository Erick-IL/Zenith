# Exterior view of Hyprland windows. System colors - in palette.conf; change wallpaper
# this file is not touched, so Hyprland does not re-read the config in vain.

$gaps_out = 10
$gaps_in = 5
$border_size = 1
$active_border = rgba(c65a47ee) rgba(4d6d80ee) 45deg
$inactive_border = rgba(1b2b34aa)
$rounding = 12
$rounding_power = 4.0
$active_opacity = 1
$inactive_opacity = 1
$shadow_enabled = false
$shadow_range = 15
$shadow_render_power = 3
$shadow_color = rgba(1a1a1aee)
$blur_enabled = true
$blur_size = 10
$blur_passes = 3
$blur_vibrancy = 1696


# We take colors from a single palette
source = ~/.config/hypr/palette.conf
