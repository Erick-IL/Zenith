# The only palette of the system is “Fav”.
#
# Previously, colors went along with the wallpaper: each theme had its own accent/bg/fg, and
# Changing the picture recolored the terminals, waybar, btop and editors. Now
# the palette is the same and lives here, and only the wallpaper changes the themes.
#
# Handles; to distribute colors by application, you need to do it once
# run ~/.config/hypr/scripts/palette.sh.

$accent_color = #c65a47
$bg_color = #1b2b34
$fg_color = #e5d1c5

# The background of the terminals can be darker than the general one: if there is no line, $bg_color is taken.
$term_bg = #1b2b34
