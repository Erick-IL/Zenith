    <ellipse cx="59" cy="50" rx="5" ry="6.5" stroke-width="1.5"/>
    <!-- Nariz (Cavidade Nasal) -->
    <polygon points="50,58 47,66 53,66" stroke-width="1"/>
    <!-- Dentes da Maxila -->
    <line x1="44" y1="78" x2="44" y2="72" stroke-width="1.5"/>
    <line x1="48" y1="78" x2="48" y2="72" stroke-width="1.5"/>
    <line x1="52" y1="78" x2="52" y2="72" stroke-width="1.5"/>
    <line x1="56" y1="78" x2="56" y2="72" stroke-width="1.5"/>
  </g>
</svg>