context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Zenith Equalizer"
            media.name       = "Zenith Equalizer"
            filter.graph = {
                nodes = [
                    { type = builtin name = eq_band_1 label = bq_lowshelf control = { "Freq" = 60.0 "Q" = 1.0 "Gain" = 5.00 } }
                    { type = builtin name = eq_band_2 label = bq_peaking control = { "Freq" = 150.0 "Q" = 1.0 "Gain" = 3.00 } }
                    { type = builtin name = eq_band_3 label = bq_peaking control = { "Freq" = 400.0 "Q" = 1.0 "Gain" = -1.00 } }
                    { type = builtin name = eq_band_4 label = bq_peaking control = { "Freq" = 1000.0 "Q" = 1.0 "Gain" = -2.00 } }
                    { type = builtin name = eq_band_5 label = bq_peaking control = { "Freq" = 2400.0 "Q" = 1.0 "Gain" = 1.00 } }
                    { type = builtin name = eq_band_6 label = bq_peaking control = { "Freq" = 6000.0 "Q" = 1.0 "Gain" = 3.00 } }
                    { type = builtin name = eq_band_7 label = bq_peaking control = { "Freq" = 12000.0 "Q" = 1.0 "Gain" = 5.00 } }
                    { type = builtin name = eq_band_8 label = bq_highshelf control = { "Freq" = 16000.0 "Q" = 1.0 "Gain" = 5.00 } }
                ]
                links = [
                    { output = "eq_band_1:Out" input = "eq_band_2:In" }
                    { output = "eq_band_2:Out" input = "eq_band_3:In" }
                    { output = "eq_band_3:Out" input = "eq_band_4:In" }
                    { output = "eq_band_4:Out" input = "eq_band_5:In" }
                    { output = "eq_band_5:Out" input = "eq_band_6:In" }
                    { output = "eq_band_6:Out" input = "eq_band_7:In" }
                    { output = "eq_band_7:Out" input = "eq_band_8:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name        = "effect_input.zenith_eq"
                node.description = "Zenith Equalizer"
                media.class      = Audio/Sink
            }
            playback.props = {
                node.name        = "effect_output.zenith_eq"
                node.passive     = true
            }
        }
    }
